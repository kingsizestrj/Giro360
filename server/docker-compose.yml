services:
  giro360:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    # As configurações vêm do arquivo .env (que fica só no seu servidor).
    # Copie .env.example para .env e edite lá — assim "git pull" nunca dá conflito.
    environment:
      API_KEY: "${API_KEY:-troque-esta-chave}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8080}"
      VIDEO_ENCODER: "${VIDEO_ENCODER:-libx264}"
      VIDEO_PRESET: "${VIDEO_PRESET:-veryfast}"
      VIDEO_CRF: "${VIDEO_CRF:-23}"
      MAX_HEIGHT: "${MAX_HEIGHT:-1080}"
      LIBVA_DRIVER_NAME: "${LIBVA_DRIVER_NAME:-iHD}"
    # Para aceleração Intel (VAAPI) descomente o bloco abaixo e defina
    # VIDEO_ENCODER=h264_vaapi no .env:
    # devices:
    #   - /dev/dri:/dev/dri
    volumes:
      - ./data:/data

