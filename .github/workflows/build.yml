name: Build APK

# Roda automaticamente a cada push, e também pode ser disparado manualmente
on:
  push:
    branches: [ main, master, "claude/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Fica vazio até você cadastrar os Secrets; aí as etapas de release ligam.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Dar permissão ao gradlew
        run: chmod +x ./gradlew

      - name: Compilar o APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar o APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: Giro360-apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # ---- Release assinado (só roda se os Secrets de assinatura existirem) ----
      - name: Restaurar keystore de assinatura
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Compilar o APK de release (assinado)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Publicar o APK de release
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Prime360-release
          path: app/build/outputs/apk/release/app-release.apk
